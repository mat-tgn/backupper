version: '3.8'

services:
  # Applicazione Backupper
  backupper:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "3001:3001"  # App (API + frontend buildato)
    volumes:
      - ./server/backups:/app/server/backups  # Volume per i backup
      - ./server/data:/app/server/data  # Volume per i dati persistenti
      - ./logs:/app/logs  # Volume per i log
    environment:
      - NODE_ENV=production
      - PORT=3001
    depends_on:
      - mysql
    networks:
      - backupper-network
    restart: unless-stopped

  # Database MySQL per test
